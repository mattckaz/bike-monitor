name: Bike Deal Finder

on:
  schedule:
    # Run every 4 hours
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pip show playwright | grep Version | cut -d' ' -f2)" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: python -m playwright install chromium

      - name: Install Playwright system dependencies
        run: python -m playwright install-deps chromium

      - name: Verify Playwright browsers (auto-heal if cache is stale)
        run: |
          python -c "
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch(headless=True)
              b.close()
          print('Chromium OK')
          " || (echo "Browser check failed — reinstalling..." && python -m playwright install chromium)

      - name: Restore state
        run: |
          if [ ! -f bike_state.json ]; then
            echo '{"seen_urls":[],"last_run":null,"deals_found":[]}' > bike_state.json
          fi

      - name: Run bike deal finder
        env:
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN:           ${{ secrets.GH_TOKEN }}
          GITHUB_TOKEN:       ${{ secrets.GITHUB_TOKEN }}
        run: python bike_monitor.py

      - name: Email on workflow failure
        if: failure()
        env:
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
        run: python bike_monitor.py --notify-failure

      - name: Commit updated state
        run: |
          git config user.name  "bike-monitor[bot]"
          git config user.email "bike-monitor[bot]@users.noreply.github.com"
          git add bike_state.json
          if git diff --cached --quiet; then
            echo "No state changes — skipping commit."
          else
            git commit -m "chore: update bike state [skip ci]"
            for attempt in 1 2 3; do
              if git push; then
                echo "State pushed on attempt ${attempt}."
                break
              fi
              echo "Push rejected (attempt ${attempt}) — pulling and retrying..."
              git stash
              if ! git pull --rebase; then
                git rebase --abort
                git stash pop || true
                echo "Rebase conflict — skipping state update. Next run will re-sync."
                break
              fi
              git stash pop || true
            done
          fi
